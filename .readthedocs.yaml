# Read the Docs project configuration.
# https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Install with uv, honoring uv.lock. Pulls the project (for autodoc imports)
# plus the `docs` dependency group defined in pyproject.toml.
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/conf.py
