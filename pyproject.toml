[project]
name = "protuna"
version = "0.1.0"
description = "Optimization framework for AI-guided protein engineering"
readme = "README.md"
authors = [
    { name = "Kumar Shreshtha", email = "kumar.shreshtha@protuna.org" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "einops>=0.8.2",
    "huggingface-hub>=1.5.0",
    "jaxtyping>=0.3.9",
    "lmdb>=3.0.0",
    "numpy>=1.26.0",
    "polars>=1.36.1",
    "psutil>=5.9.8",
    "ray>=2.52.0",
    "requests>=2.32.5",
    "scikit-learn>=1.3.1",
    "torch>=2.10.0",
    "tqdm>=4.66.0",
    "transformers>=5.3.0",
]

[project.urls]
Homepage = "https://github.com/kumarshreshtha/protuna"
Documentation = "https://protuna.readthedocs.org"
Issues = "https://github.com/kumarshreshtha/protuna/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["protuna"]

[tool.hatch.build.targets.sdist]
only-include = [
    "protuna",
    "tests",
    "examples",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
# "protuna" for doctests.
testpaths = ["tests", "protuna"]
addopts = ["--doctest-modules", "--import-mode=importlib", "-m", "not integration"]
markers = [
  "integration: exercises real datasets, model checkpoints or Ray workers",
]

[dependency-groups]
docs = [
    "furo>=2024.1.29",
    "myst-parser>=4.0.0",
    "sphinx>=9.0.0",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-bibtex>=2.6.0",
    "sphinxcontrib-mermaid>=2.1.1",
]
dev = [
    { include-group = "docs" },
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "ruff==0.16.4", # keep in sync with ruff-pre-commit rev
    "sphinx-autobuild>=2025.8.25",
    "ty==0.0.76",
]

[tool.ty.src]
include = ["protuna", "tests", "examples"]
